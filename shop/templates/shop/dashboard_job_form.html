<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a job · phoneCase254</title><link rel="stylesheet" href="{% static 'shop/css/dashboard.css' %}"><link rel="stylesheet" href="{% static 'shop/css/dashboard-extra.css' %}"><link rel="stylesheet" href="{% static 'shop/css/dashboard-dark.css' %}"><link rel="stylesheet" href="{% static 'shop/css/dashboard-contrast.css' %}"></head><body class="dashboard-body"><aside class="dashboard-sidebar"><a class="dashboard-brand" href="{% url 'dashboard' %}"><span>phone</span>Case254<small>STORE CONTROL</small></a><nav class="dashboard-nav"><a class="active" href="{% url 'dashboard_jobs' %}">✦ Jobs</a><a href="{% url 'dashboard' %}">⌂ Dashboard</a></nav></aside><main class="dashboard-main"><section class="dashboard-content"><div class="dashboard-heading"><div><p class="dashboard-eyebrow">People</p><h1>Post a job</h1><p>Create a role and publish it to the careers page.</p></div><a class="button-dashboard" href="{% url 'dashboard_jobs' %}">← Jobs</a></div><section class="panel dashboard-form-panel"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}<button class="dashboard-submit" type="submit">Save job posting ↗</button></form></section></section></main></body></html>
